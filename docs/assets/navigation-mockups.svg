<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
  <title id="title">PocketPlates navigation mockups</title>
  <desc id="desc">Three mobile mockups showing the approved Home, centered Add, and More navigation; the More bottom sheet; and an explicitly unconfirmed future five-slot navigation concept.</desc>
  <defs>
    <style>
      .canvas { fill: #f8faf7; }
      .phone { fill: #151a1f; rx: 30; }
      .screen { fill: #fffdf8; rx: 22; }
      .header { fill: #eaf5ec; }
      .surface { fill: #ffffff; stroke: #d9e1db; stroke-width: 1.2; rx: 10; }
      .image { fill: #dcefe0; rx: 8; }
      .chip { fill: #f1f8f2; stroke: #cfe1d3; stroke-width: 1; rx: 12; }
      .bottom { fill: #f3faf4; stroke: #dbe3dd; stroke-width: 1; }
      .sheet { fill: #ffffff; stroke: #d9e1db; stroke-width: 1.2; }
      .add { fill: #2f7147; }
      .future { fill: #fffaf0; stroke: #c99b48; stroke-width: 1.4; stroke-dasharray: 7 5; rx: 14; }
      .divider { stroke: #e3e8e4; stroke-width: 1; }
      .heading { font: 700 28px Arial, sans-serif; fill: #263238; }
      .subheading { font: 700 17px Arial, sans-serif; fill: #263238; }
      .label { font: 700 14px Arial, sans-serif; fill: #263238; }
      .body { font: 500 12px Arial, sans-serif; fill: #52615a; }
      .small { font: 600 10px Arial, sans-serif; fill: #6b7971; }
      .nav-active { font: 700 10px Arial, sans-serif; fill: #2f7147; }
      .nav-label { font: 700 10px Arial, sans-serif; fill: #6b7971; }
      .white { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .future-text { font: 700 12px Arial, sans-serif; fill: #8a5c10; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1120" height="790"/>
  <text class="heading" x="44" y="50">PocketPlates navigation direction</text>
  <text class="body" x="44" y="75">Approved near-term pattern: Home · centered Add · More</text>

  <!-- Confirmed base navigation -->
  <rect class="phone" x="46" y="108" width="300" height="560"/>
  <rect class="screen" x="58" y="120" width="276" height="536"/>
  <rect class="header" x="58" y="120" width="276" height="118" rx="22"/>
  <text class="label" x="78" y="158">PocketPlates</text>
  <text class="small" x="78" y="176">cook@example.com</text>
  <rect class="surface" x="255" y="140" width="60" height="32"/>
  <text class="small center" x="285" y="160">Sign out</text>
  <rect class="surface" x="78" y="190" width="236" height="34"/>
  <text class="small" x="92" y="211">⌕  Search recipes</text>

  <rect class="chip" x="78" y="254" width="38" height="25"/>
  <text class="small center" x="97" y="271">All</text>
  <rect class="chip" x="122" y="254" width="55" height="25"/>
  <text class="small center" x="149" y="271">Dinner</text>
  <text class="nav-active" x="264" y="271">☷ Filters</text>

  <rect class="surface" x="78" y="298" width="105" height="142"/>
  <rect class="image" x="88" y="308" width="85" height="76"/>
  <text class="label center" x="130" y="405">Egg fried rice</text>
  <text class="small center" x="130" y="424">Cheap · Easy</text>
  <rect class="surface" x="209" y="298" width="105" height="142"/>
  <rect class="image" x="219" y="308" width="85" height="76"/>
  <text class="label center" x="261" y="405">Tomato pasta</text>
  <text class="small center" x="261" y="424">Moderate · Easy</text>

  <rect class="bottom" x="58" y="578" width="276" height="78"/>
  <text class="nav-active center" x="104" y="624">⌂</text>
  <text class="nav-active center" x="104" y="642">Home</text>
  <circle class="add" cx="196" cy="614" r="25"/>
  <text class="white center" x="196" y="623">+</text>
  <text class="nav-label center" x="288" y="624">•••</text>
  <text class="nav-label center" x="288" y="642">More</text>

  <text class="subheading center" x="196" y="706">Confirmed: default state</text>
  <text class="body center" x="196" y="730">Three equal slots keep Add exactly centered.</text>

  <!-- Confirmed More sheet -->
  <rect class="phone" x="410" y="108" width="300" height="560"/>
  <rect class="screen" x="422" y="120" width="276" height="536"/>
  <rect class="header" x="422" y="120" width="276" height="118" rx="22"/>
  <text class="label" x="442" y="158">PocketPlates</text>
  <text class="small" x="442" y="176">cook@example.com</text>
  <rect class="surface" x="619" y="140" width="60" height="32"/>
  <text class="small center" x="649" y="160">Sign out</text>
  <rect class="surface" x="442" y="190" width="236" height="34"/>
  <text class="small" x="456" y="211">⌕  Search recipes</text>
  <rect class="surface" x="442" y="258" width="105" height="142" opacity="0.58"/>
  <rect class="image" x="452" y="268" width="85" height="76" opacity="0.58"/>
  <rect class="surface" x="573" y="258" width="105" height="142" opacity="0.58"/>
  <rect class="image" x="583" y="268" width="85" height="76" opacity="0.58"/>

  <path d="M422 378 Q422 354 446 354 H674 Q698 354 698 378 V656 H422 Z" fill="#ffffff" stroke="#d9e1db" stroke-width="1.2"/>
  <rect x="541" y="366" width="38" height="4" rx="2" fill="#cbd5ce"/>
  <text class="subheading" x="446" y="405">More</text>
  <line class="divider" x1="446" y1="423" x2="674" y2="423"/>
  <text class="label" x="446" y="454">Archived recipes</text>
  <text class="body" x="660" y="454">›</text>
  <line class="divider" x1="446" y1="472" x2="674" y2="472"/>
  <text class="label" x="446" y="503">Collections</text>
  <text class="small" x="594" y="503">future</text>
  <text class="body" x="660" y="503">›</text>
  <line class="divider" x1="446" y1="521" x2="674" y2="521"/>
  <text class="label" x="446" y="552">Settings</text>
  <text class="small" x="606" y="552">future</text>
  <text class="body" x="660" y="552">›</text>
  <line class="divider" x1="446" y1="570" x2="674" y2="570"/>
  <text class="small center" x="560" y="613">Secondary pages can be added here</text>

  <text class="subheading center" x="560" y="706">Confirmed: More sheet</text>
  <text class="body center" x="560" y="730">Archived lives here; future pages do not crowd the bar.</text>

  <!-- Unconfirmed future concept -->
  <rect class="future" x="758" y="92" width="318" height="650"/>
  <text class="future-text center" x="917" y="120">FUTURE EXPLORATION — NOT CONFIRMED</text>
  <text class="small center" x="917" y="140">Not planned for the near term</text>
  <rect class="phone" x="768" y="158" width="298" height="510"/>
  <rect class="screen" x="780" y="170" width="274" height="486"/>
  <rect class="header" x="780" y="170" width="274" height="110" rx="22"/>
  <text class="label" x="800" y="208">PocketPlates</text>
  <rect class="surface" x="800" y="228" width="234" height="34"/>
  <text class="small" x="814" y="249">⌕  Search recipes</text>
  <rect class="surface" x="800" y="302" width="104" height="140"/>
  <rect class="image" x="810" y="312" width="84" height="75"/>
  <rect class="surface" x="930" y="302" width="104" height="140"/>
  <rect class="image" x="940" y="312" width="84" height="75"/>

  <rect class="bottom" x="780" y="574" width="274" height="82"/>
  <text class="nav-active center" x="807" y="616">⌂</text>
  <text class="nav-active center" x="807" y="636">Home</text>
  <text class="nav-label center" x="862" y="616">▦</text>
  <text class="nav-label center" x="862" y="636">Planner</text>
  <circle class="add" cx="917" cy="610" r="24"/>
  <text class="white center" x="917" y="619">+</text>
  <text class="nav-label center" x="972" y="616">☑</text>
  <text class="nav-label center" x="972" y="636">Groceries</text>
  <text class="nav-label center" x="1027" y="616">•••</text>
  <text class="nav-label center" x="1027" y="636">More</text>

  <text class="body center" x="917" y="698">Only reconsider when Planner and Groceries</text>
  <text class="body center" x="917" y="717">become real, frequently used destinations.</text>
</svg>
