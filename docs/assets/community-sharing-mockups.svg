<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1840" viewBox="0 0 1500 1840" role="img" aria-labelledby="title desc">
  <title id="title">Community recipe sharing and saving mockups</title>
  <desc id="desc">Five mobile screens show direct public publishing without a rights checkbox, community search and filters, a public recipe, a save sheet, and a separate saved recipes library. Sharing is public-only; no unlisted links or recipe copying are included.</desc>
  <defs>
    <style>
      .canvas { fill: #f7faf7; }
      .phone { fill: #172019; }
      .screen { fill: #fffdf8; }
      .appbar { fill: #eef6ef; }
      .surface { fill: #ffffff; stroke: #d7e2da; stroke-width: 1.5; }
      .muted-surface { fill: #f3f7f3; stroke: #d7e2da; stroke-width: 1.5; }
      .primary { fill: #2f6f50; }
      .primary-soft { fill: #e0f0e4; }
      .warm { fill: #f7eedf; }
      .danger-soft { fill: #fff1ef; stroke: #edc6c0; stroke-width: 1.5; }
      .scrim { fill: #172019; opacity: 0.26; }
      .divider { stroke: #d7e2da; stroke-width: 1.5; }
      .icon { fill: none; stroke: #496354; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-white { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #172019; font: 700 21px Arial, sans-serif; }
      .heading { fill: #172019; font: 700 16px Arial, sans-serif; }
      .body { fill: #25382c; font: 14px Arial, sans-serif; }
      .small { fill: #617068; font: 12px Arial, sans-serif; }
      .tiny { fill: #617068; font: 11px Arial, sans-serif; }
      .label { fill: #32483a; font: 700 12px Arial, sans-serif; }
      .button { fill: #ffffff; font: 700 14px Arial, sans-serif; }
      .button-secondary { fill: #2f6f50; font: 700 14px Arial, sans-serif; }
      .chip { fill: #2f6f50; font: 700 11px Arial, sans-serif; }
      .nav { fill: #617068; font: 10px Arial, sans-serif; }
      .nav-active { fill: #2f6f50; font: 700 10px Arial, sans-serif; }
      .caption-title { fill: #172019; font: 700 18px Arial, sans-serif; }
      .caption { fill: #52635a; font: 14px Arial, sans-serif; }
    </style>
    <clipPath id="phone-screen"><rect x="12" y="12" width="336" height="736" rx="30"/></clipPath>
  </defs>

  <rect class="canvas" width="1500" height="1840"/>
  <text x="750" y="43" text-anchor="middle" class="title">Community sharing and saved recipes</text>
  <text x="750" y="69" text-anchor="middle" class="body">Public-only publishing, useful discovery filters, link sharing, and bookmark-style saving—without copying or unlisted links.</text>

  <!-- Screen 1: publish confirmation -->
  <g transform="translate(70 95)">
    <rect class="phone" width="360" height="760" rx="42"/>
    <rect class="screen" x="12" y="12" width="336" height="736" rx="30"/>
    <g clip-path="url(#phone-screen)">
      <rect x="12" y="12" width="336" height="736" fill="#fffdf8"/>
      <rect class="appbar" x="12" y="12" width="336" height="76"/>
      <path class="icon" d="M37 50h18M37 50l8-8M37 50l8 8"/>
      <text x="72" y="57" class="title">Lemon pasta</text>
      <rect class="warm" x="34" y="112" width="292" height="156" rx="17"/>
      <circle cx="180" cy="180" r="42" fill="#f1d789"/>
      <path d="M148 180c18-21 46-21 64 0-18 21-46 21-64 0z" fill="#fff6d3"/>
      <text x="34" y="304" class="heading">Lemon pasta</text>
      <text x="34" y="328" class="small">20 min · Easy · Vegetarian</text>
      <rect class="primary" x="34" y="366" width="292" height="50" rx="13"/>
      <path class="icon-white" d="M105 389h18M114 380v18"/>
      <text x="197" y="397" text-anchor="middle" class="button">Publish to community</text>

      <rect class="scrim" x="12" y="12" width="336" height="736"/>
      <rect x="12" y="352" width="336" height="396" rx="26" fill="#fffdf8"/>
      <rect x="153" y="367" width="54" height="5" rx="3" fill="#c4d1c7"/>
      <text x="36" y="413" class="title">Publish to community?</text>
      <text x="36" y="441" class="body">Anyone can view this recipe and share</text>
      <text x="36" y="461" class="body">its public link.</text>

      <rect class="muted-surface" x="36" y="490" width="288" height="94" rx="14"/>
      <circle cx="62" cy="520" r="13" fill="#dbe9df"/>
      <text x="62" y="525" text-anchor="middle" class="label">DL</text>
      <text x="84" y="516" class="label">PUBLISHED BY</text>
      <text x="84" y="538" class="body">Dani Lim · @dlkl</text>
      <text x="52" y="566" class="small">Title, ingredients, steps, and image become public.</text>

      <rect class="surface" x="36" y="612" width="132" height="50" rx="13"/>
      <text x="102" y="643" text-anchor="middle" class="button-secondary">Cancel</text>
      <rect class="primary" x="180" y="612" width="144" height="50" rx="13"/>
      <text x="252" y="643" text-anchor="middle" class="button">Publish recipe</text>
    </g>
  </g>

  <!-- Screen 2: discovery -->
  <g transform="translate(570 95)">
    <rect class="phone" width="360" height="760" rx="42"/>
    <rect class="screen" x="12" y="12" width="336" height="736" rx="30"/>
    <g clip-path="url(#phone-screen)">
      <rect x="12" y="12" width="336" height="736" fill="#fffdf8"/>
      <rect class="appbar" x="12" y="12" width="336" height="76"/>
      <text x="36" y="57" class="title">Community</text>
      <circle cx="310" cy="50" r="18" fill="#dcebdd"/>
      <text x="310" y="55" text-anchor="middle" class="label">DL</text>

      <rect class="surface" x="34" y="108" width="292" height="48" rx="13"/>
      <circle cx="57" cy="132" r="7" class="icon"/>
      <path class="icon" d="M62 137l6 6"/>
      <text x="78" y="137" class="small">Search recipes or ingredients</text>

      <rect class="primary-soft" x="34" y="174" width="58" height="32" rx="16"/>
      <text x="63" y="194" text-anchor="middle" class="chip">All</text>
      <rect class="surface" x="100" y="174" width="83" height="32" rx="16"/>
      <text x="141" y="194" text-anchor="middle" class="tiny">Vegetarian</text>
      <rect class="surface" x="191" y="174" width="64" height="32" rx="16"/>
      <text x="223" y="194" text-anchor="middle" class="tiny">≤ 30 min</text>
      <rect class="surface" x="263" y="174" width="63" height="32" rx="16"/>
      <text x="294" y="194" text-anchor="middle" class="tiny">Filters</text>

      <rect class="surface" x="34" y="228" width="292" height="178" rx="16"/>
      <rect class="warm" x="34" y="228" width="112" height="178" rx="16"/>
      <circle cx="90" cy="300" r="31" fill="#f1d789"/>
      <path d="M69 300c12-14 30-14 42 0-12 14-30 14-42 0z" fill="#fff6d3"/>
      <text x="162" y="258" class="heading">Lemon pasta</text>
      <text x="162" y="281" class="small">by Dani Lim</text>
      <text x="162" y="310" class="small">20 min · Easy</text>
      <rect class="primary-soft" x="162" y="329" width="75" height="27" rx="14"/>
      <text x="199" y="347" text-anchor="middle" class="tiny">Vegetarian</text>
      <path class="icon" d="M170 375v-13h16v13l-8-5z"/>
      <text x="195" y="374" class="button-secondary">Save</text>

      <rect class="surface" x="34" y="424" width="292" height="178" rx="16"/>
      <rect x="34" y="424" width="112" height="178" rx="16" fill="#e3efe3"/>
      <circle cx="90" cy="496" r="31" fill="#9dc5a8"/>
      <path d="M70 505c12-24 28-24 40 0" fill="none" stroke="#f8fff9" stroke-width="8" stroke-linecap="round"/>
      <text x="162" y="454" class="heading">Green curry</text>
      <text x="162" y="477" class="small">by Mira Tan</text>
      <text x="162" y="506" class="small">35 min · Medium</text>
      <rect class="primary-soft" x="162" y="525" width="75" height="27" rx="14"/>
      <text x="199" y="543" text-anchor="middle" class="tiny">Dairy-free</text>
      <path class="icon" d="M170 571v-13h16v13l-8-5z"/>
      <text x="195" y="570" class="button-secondary">Save</text>

      <rect x="12" y="668" width="336" height="80" fill="#ffffff"/>
      <path class="divider" d="M12 668h336"/>
      <path class="icon" d="M50 695l11-9 11 9v16h-8v-9h-7v9h-7z"/>
      <text x="61" y="732" text-anchor="middle" class="nav">Home</text>
      <circle class="primary" cx="180" cy="694" r="27"/>
      <path class="icon-white" d="M169 694h22M180 683v22"/>
      <path class="icon" d="M290 692c5-10 21-8 21 4 0 10-10 14-15 19-5-5-15-9-15-19 0-7 5-10 9-4z"/>
      <text x="296" y="732" text-anchor="middle" class="nav-active">Community</text>
    </g>
  </g>

  <!-- Screen 3: public recipe -->
  <g transform="translate(1070 95)">
    <rect class="phone" width="360" height="760" rx="42"/>
    <rect class="screen" x="12" y="12" width="336" height="736" rx="30"/>
    <g clip-path="url(#phone-screen)">
      <rect x="12" y="12" width="336" height="736" fill="#fffdf8"/>
      <rect class="warm" x="12" y="12" width="336" height="232"/>
      <circle cx="180" cy="119" r="61" fill="#f1d789"/>
      <path d="M137 120c24-30 62-30 86 0-24 30-62 30-86 0z" fill="#fff6d3"/>
      <circle cx="43" cy="47" r="20" fill="#ffffff" opacity="0.9"/>
      <path class="icon" d="M50 47H36M36 47l7-7M36 47l7 7"/>
      <circle cx="314" cy="47" r="20" fill="#ffffff" opacity="0.9"/>
      <path class="icon" d="M307 45l14-8M307 49l14 8M307 45v4M321 37v5M321 52v5"/>

      <text x="34" y="282" class="title">Lemon pasta</text>
      <circle cx="47" cy="315" r="13" fill="#dbe9df"/>
      <text x="47" y="319" text-anchor="middle" class="tiny">DL</text>
      <text x="68" y="319" class="body">Dani Lim · @dlkl</text>
      <text x="34" y="350" class="small">20 min · Easy · Serves 2</text>

      <rect class="surface" x="34" y="374" width="138" height="48" rx="13"/>
      <path class="icon" d="M57 405v-17h17v17l-8-5z"/>
      <text x="116" y="404" text-anchor="middle" class="button-secondary">Save</text>
      <rect class="primary" x="184" y="374" width="142" height="48" rx="13"/>
      <path class="icon-white" d="M207 394l14-8M207 398l14 8M207 394v4M221 386v5M221 401v5"/>
      <text x="267" y="404" text-anchor="middle" class="button">Share link</text>

      <text x="34" y="468" class="heading">Ingredients</text>
      <circle cx="40" cy="497" r="3" fill="#2f6f50"/>
      <text x="52" y="502" class="body">200 g spaghetti</text>
      <circle cx="40" cy="525" r="3" fill="#2f6f50"/>
      <text x="52" y="530" class="body">1 lemon</text>
      <circle cx="40" cy="553" r="3" fill="#2f6f50"/>
      <text x="52" y="558" class="body">2 tbsp olive oil</text>

      <text x="34" y="600" class="heading">Method</text>
      <circle cx="44" cy="628" r="13" fill="#e0f0e4"/>
      <text x="44" y="633" text-anchor="middle" class="label">1</text>
      <text x="66" y="625" class="body">Boil the pasta until al dente.</text>
      <text x="66" y="645" class="body">Reserve a little cooking water.</text>

      <text x="34" y="699" class="small">Hide recipe</text>
      <text x="124" y="699" class="small">Report</text>
    </g>
  </g>

  <!-- Top captions -->
  <text x="250" y="897" text-anchor="middle" class="caption-title">1. Publish directly</text>
  <text x="250" y="923" text-anchor="middle" class="caption">One clear confirmation. No rights checkbox.</text>
  <text x="750" y="897" text-anchor="middle" class="caption-title">2. Search and filter</text>
  <text x="750" y="923" text-anchor="middle" class="caption">Browse public recipes by useful cooking criteria.</text>
  <text x="1250" y="897" text-anchor="middle" class="caption-title">3. View, share, or save</text>
  <text x="1250" y="923" text-anchor="middle" class="caption">A public recipe has a normal shareable URL.</text>

  <!-- Screen 4: save sheet -->
  <g transform="translate(320 980)">
    <rect class="phone" width="360" height="760" rx="42"/>
    <rect class="screen" x="12" y="12" width="336" height="736" rx="30"/>
    <g clip-path="url(#phone-screen)">
      <rect x="12" y="12" width="336" height="736" fill="#fffdf8"/>
      <rect class="warm" x="12" y="12" width="336" height="230"/>
      <circle cx="180" cy="118" r="60" fill="#f1d789"/>
      <path d="M138 119c24-29 60-29 84 0-24 29-60 29-84 0z" fill="#fff6d3"/>
      <text x="34" y="284" class="title">Lemon pasta</text>
      <text x="34" y="314" class="small">by Dani Lim · @dlkl</text>
      <rect class="scrim" x="12" y="12" width="336" height="736"/>

      <rect x="12" y="292" width="336" height="456" rx="26" fill="#fffdf8"/>
      <rect x="153" y="307" width="54" height="5" rx="3" fill="#c4d1c7"/>
      <text x="36" y="352" class="title">Save recipe</text>
      <text x="36" y="379" class="small">Keep a bookmark to the author’s recipe.</text>

      <rect class="muted-surface" x="36" y="404" width="288" height="54" rx="13"/>
      <path class="icon" d="M55 440v-19h18v19l-9-6z"/>
      <text x="87" y="429" class="body">Save to Saved Recipes</text>
      <path class="icon" d="M290 421v18M281 430h18"/>

      <rect class="surface" x="36" y="474" width="288" height="54" rx="13"/>
      <path class="icon" d="M53 496c4-8 16-6 16 3 0 8-8 11-12 15-4-4-12-7-12-15 0-5 4-7 8-3z"/>
      <text x="87" y="507" class="body">Add to Favorites</text>
      <circle cx="296" cy="501" r="10" fill="#ffffff" stroke="#96aa9d" stroke-width="1.5"/>

      <text x="36" y="566" class="label">COLLECTION</text>
      <rect class="surface" x="36" y="578" width="288" height="50" rx="12"/>
      <text x="52" y="609" class="body">Weeknight dinners</text>
      <path class="icon" d="M294 597l7 7 7-7"/>
      <text x="36" y="654" class="button-secondary">+ Create collection</text>

      <rect class="primary" x="36" y="680" width="288" height="50" rx="13"/>
      <text x="180" y="711" text-anchor="middle" class="button">Save recipe</text>
    </g>
  </g>

  <!-- Screen 5: saved recipes -->
  <g transform="translate(820 980)">
    <rect class="phone" width="360" height="760" rx="42"/>
    <rect class="screen" x="12" y="12" width="336" height="736" rx="30"/>
    <g clip-path="url(#phone-screen)">
      <rect x="12" y="12" width="336" height="736" fill="#fffdf8"/>
      <rect class="appbar" x="12" y="12" width="336" height="76"/>
      <path class="icon" d="M37 50h18M37 50l8-8M37 50l8 8"/>
      <text x="72" y="57" class="title">Saved Recipes</text>

      <rect class="primary-soft" x="34" y="110" width="70" height="34" rx="17"/>
      <text x="69" y="132" text-anchor="middle" class="chip">All</text>
      <rect class="surface" x="112" y="110" width="82" height="34" rx="17"/>
      <text x="153" y="132" text-anchor="middle" class="tiny">Favorites</text>
      <rect class="surface" x="202" y="110" width="124" height="34" rx="17"/>
      <text x="256" y="132" text-anchor="middle" class="tiny">All collections</text>
      <path class="icon" d="M306 124l5 5 5-5"/>

      <rect class="surface" x="34" y="168" width="292" height="176" rx="16"/>
      <rect class="warm" x="34" y="168" width="112" height="176" rx="16"/>
      <circle cx="90" cy="238" r="31" fill="#f1d789"/>
      <path d="M69 238c12-14 30-14 42 0-12 14-30 14-42 0z" fill="#fff6d3"/>
      <text x="162" y="198" class="heading">Lemon pasta</text>
      <text x="162" y="221" class="small">by Dani Lim</text>
      <text x="162" y="250" class="small">Weeknight dinners</text>
      <path d="M165 279c4-8 16-6 16 3 0 8-8 11-12 15-4-4-12-7-12-15 0-5 4-7 8-3z" fill="#2f6f50"/>
      <text x="193" y="289" class="small">Favorite</text>
      <path class="icon" d="M296 196h12M302 190v12"/>

      <rect class="danger-soft" x="34" y="366" width="292" height="126" rx="16"/>
      <rect x="52" y="384" width="52" height="52" rx="12" fill="#f0dbd7"/>
      <path d="M65 410h26M78 397v26" stroke="#9d6b64" stroke-width="2" opacity="0.6"/>
      <text x="120" y="398" class="heading">Recipe unavailable</text>
      <text x="120" y="420" class="small">This recipe is no longer public.</text>
      <text x="52" y="466" class="button-secondary">Remove from saved</text>

      <rect class="muted-surface" x="34" y="520" width="292" height="78" rx="15"/>
      <text x="52" y="549" class="label">SAVED, NOT COPIED</text>
      <text x="52" y="571" class="small">Updates follow the author’s public recipe.</text>
      <text x="52" y="588" class="small">Private or deleted recipes become unavailable.</text>

      <rect x="12" y="668" width="336" height="80" fill="#ffffff"/>
      <path class="divider" d="M12 668h336"/>
      <path class="icon" d="M50 695l11-9 11 9v16h-8v-9h-7v9h-7z"/>
      <text x="61" y="732" text-anchor="middle" class="nav-active">Home</text>
      <circle class="primary" cx="180" cy="694" r="27"/>
      <path class="icon-white" d="M169 694h22M180 683v22"/>
      <circle cx="291" cy="694" r="2.5" fill="#617068"/><circle cx="299" cy="694" r="2.5" fill="#617068"/><circle cx="307" cy="694" r="2.5" fill="#617068"/>
      <text x="299" y="732" text-anchor="middle" class="nav">More</text>
    </g>
  </g>

  <!-- Bottom captions -->
  <text x="500" y="1790" text-anchor="middle" class="caption-title">4. Choose how to save</text>
  <text x="500" y="1816" text-anchor="middle" class="caption">Favorite and collection choices stay in one sheet.</text>
  <text x="1000" y="1790" text-anchor="middle" class="caption-title">5. Keep saves separate</text>
  <text x="1000" y="1816" text-anchor="middle" class="caption">Saved Recipes stays distinct from recipes you own.</text>
</svg>
